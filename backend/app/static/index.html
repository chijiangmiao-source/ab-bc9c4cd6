<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深空站帧接收器</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; margin: 0; padding: 2rem; background: #0b1020; color: #e6e9f0; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  .card { background: #141a2e; border: 1px solid #26304f; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; max-width: 900px; }
  label { display:block; font-size: .85rem; color: #aab3cc; margin: .5rem 0 .2rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: .5rem .6rem; border-radius: 6px; border: 1px solid #33405f; background: #0e1428; color: #e6e9f0; font: inherit; }
  textarea { min-height: 4.5rem; font-family: ui-monospace, monospace; }
  button { margin-top: .8rem; padding: .5rem 1rem; border-radius: 6px; border: 0; background: #3b6cf6; color: #fff; font: inherit; cursor: pointer; }
  button:hover { background: #2f5bd1; }
  .row { display: flex; gap: .8rem; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1; min-width: 180px; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #26304f; }
  th { color: #aab3cc; font-weight: 600; }
  .v-accepted { color: #54d68a; font-weight: 700; }
  .v-duplicate { color: #f5c451; font-weight: 700; }
  .v-stale { color: #f08a8a; font-weight: 700; }
  .v-rejected { color: #ff5d5d; font-weight: 700; }
  .mono { font-family: ui-monospace, monospace; }
  #positions { display: flex; flex-wrap: wrap; gap: .25rem; }
  #positions span { background: #0e1428; border: 1px solid #26304f; border-radius: 4px; padding: .1rem .4rem; font-size: .75rem; }
  #positions span.new { border-color: #54d68a; color: #54d68a; }
  #status { margin-top: 1rem; color: #aab3cc; font-size: .85rem; }
  #status.error { color: #ff8a8a; }
  .hint { color: #7d88a6; font-size: .78rem; margin-top: .25rem; }
</style>
</head>
<body>
<h1>深空地面站接收器 · 32 位帧计数滑动窗口</h1>

<div class="card">
  <label for="linkId">链路标识</label>
  <div class="row">
    <div><input id="linkId" placeholder="例如：mars-relay-A"></div>
    <div style="flex:0"><button id="createBtn">创建链路</button></div>
  </div>
  <div class="hint">同一链路重启或乱序投递后继续接收；首次帧初始化 64 位滑动窗口。</div>
</div>

<div class="card">
  <div class="row">
    <div>
      <label for="rawCount">无符号 32 位计数 (0–4294967295)</label>
      <input id="rawCount" inputmode="numeric" placeholder="例如：4294967295（回绕前最后一帧）">
    </div>
    <div>
      <label for="receiptId">稳定回执标识</label>
      <input id="receiptId" placeholder="例如：frame-0001">
    </div>
  </div>
  <label for="payload">载荷（任意 JSON；相同回执标识须带完全相同载荷）</label>
  <textarea id="payload">{"telemetry": 0}</textarea>
  <button id="sendBtn">提交到达帧</button>
</div>

<div class="card">
  <h3 style="margin:.2rem 0 .6rem">当前窗口</h3>
  <table>
    <tr><th>链路</th><td id="curLink" class="mono">—</td></tr>
    <tr><th>最高扩展序号</th><td id="curHighest" class="mono">—</td></tr>
    <tr><th>位图</th><td id="curBitmap" class="mono">—</td></tr>
  </table>
  <h4 style="margin:.8rem 0 .3rem">最近 64 个已接受位置</h4>
  <div id="positions"></div>
  <div id="status"></div>
</div>

<div class="card">
  <h3 style="margin:.2rem 0 .6rem">裁决记录</h3>
  <table>
    <thead><tr><th>#</th><th>计数</th><th>回执标识</th><th>裁决</th><th>扩展序号</th><th>重放</th></tr></thead>
    <tbody id="verdictRows"></tbody>
  </table>
</div>

<script>
const $ = id => document.getElementById(id);
let seqNo = 0;

function setStatus(msg, isErr=false) {
  const el = $("status");
  el.textContent = msg;
  el.className = isErr ? "error" : "";
}

async function api(path, opts) {
  const resp = await fetch(path, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || ("HTTP " + resp.status));
  return data;
}

function renderState(data) {
  $("curLink").textContent = data.link_id;
  $("curHighest").textContent = data.highest_dec ?? "—";
  $("curBitmap").textContent = data.bitmap;
  const box = $("positions");
  box.innerHTML = "";
  const positions = data.accepted_positions_dec || [];
  for (const p of positions) {
    const s = document.createElement("span");
    s.textContent = p;
    if (p === data.highest_dec) s.className = "new";
    box.appendChild(s);
  }
}

function addRow(data) {
  seqNo += 1;
  const tr = document.createElement("tr");
  const cells = [
    seqNo,
    data.raw_count,
    data.receipt_id,
    data.verdict,
    data.extended_seq_dec === null ? "—" : data.extended_seq_dec,
    data.replayed ? "是（首次裁决）" : "否"
  ];
  for (let i = 0; i < cells.length; i++) {
    const td = document.createElement("td");
    td.textContent = cells[i];
    if (i === 3) td.className = "v-" + data.verdict;
    if (i === 1 || i === 4) td.className = "mono";
    tr.appendChild(td);
  }
  $("verdictRows").prepend(tr);
}

$("createBtn").onclick = async () => {
  const linkId = $("linkId").value.trim();
  if (!linkId) return setStatus("请填写链路标识", true);
  try {
    const data = await api("/api/links", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({link_id: linkId})
    });
    renderState(data);
    setStatus("链路已创建（或已存在则刷新查看）");
  } catch (e) {
    try { renderState(await api("/api/links/" + encodeURIComponent(linkId))); setStatus("链路已存在，已载入其窗口"); }
    catch { setStatus(e.message, true); }
  }
};

$("sendBtn").onclick = async () => {
  const linkId = $("linkId").value.trim();
  const rawCount = Number($("rawCount").value.trim());
  const receiptId = $("receiptId").value.trim();
  let payload;
  try { payload = JSON.parse($("payload").value || "null"); }
  catch { return setStatus("载荷必须是合法 JSON", true); }
  if (!linkId) return setStatus("请先填写并创建链路", true);
  if (!receiptId) return setStatus("请填写稳定回执标识", true);
  if (!Number.isInteger(rawCount) || rawCount < 0 || rawCount > 4294967295)
    return setStatus("计数必须是 0..4294967295 的无符号整数", true);
  try {
    const data = await api("/api/links/" + encodeURIComponent(linkId) + "/frames", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({raw_count: rawCount, receipt_id: receiptId, payload})
    });
    renderState(data);
    addRow(data);
    const labels = {accepted: "接受", duplicate: "重复", stale: "过期（落在窗口外）", rejected: "拒绝（纪元距离并列）"};
    setStatus(`裁决：${labels[data.verdict]}，最高扩展序号 ${data.highest_dec}${data.replayed ? "（回执重放，复用首次裁决）" : ""}`);
  } catch (e) {
    setStatus(e.message, true);
  }
};
</script>
</body>
</html>
