services:
  web:
    build: ./backend
    image: deep-space-receiver:latest
    ports:
      # 宿主端口可通过环境变量 HOST_PORT 配置（默认 8000）。
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      RECEIVER_DB: /data/receiver.db
    volumes:
      - receiver-data:/data
    restart: unless-stopped

  verify:
    image: deep-space-receiver:latest
    build: ./backend
    command: ["sh", "scripts/verify.sh"]
    environment:
      BASE_URL: http://web:8000
      # 导入检查会构造应用并初始化 DB，使用独立临时文件，避免与 web 争用。
      RECEIVER_DB: /tmp/verify-import.db
    depends_on:
      web:
        condition: service_healthy

volumes:
  receiver-data:
